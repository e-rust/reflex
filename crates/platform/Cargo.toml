[package]
name = "reflex-platform"
description = "Integração com o Windows: área de trabalho, input, sessões, clipboard, arquivos virtuais, pipes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reflex-proto.workspace = true
thiserror.workspace = true
log.workspace = true
libloading.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "fs", "time"] }
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
