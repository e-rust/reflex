[package]
name = "reflex-ui"
description = "Interface winsafe (abas Conectar / Esta máquina) e apresentação do vídeo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reflex-proto.workspace = true
reflex-viewer.workspace = true
reflex-auth.workspace = true
reflex-net.workspace = true
reflex-media.workspace = true
reflex-platform.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
serde_json.workspace = true
log.workspace = true
winsafe.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
