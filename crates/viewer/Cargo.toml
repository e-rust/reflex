[package]
name = "reflex-viewer"
description = "Lado que controla: conecta, autentica, decodifica e apresenta; captura input"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reflex-proto.workspace = true
reflex-auth.workspace = true
reflex-net.workspace = true
reflex-platform.workspace = true
reflex-media.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

[dev-dependencies]
reflex-host.workspace = true
reflex-auth.workspace = true
reflex-media.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
windows = { workspace = true, features = ["Win32_System_Power"] }
