[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/auth",
  "crates/net",
  "crates/media",
  "crates/platform",
  "crates/host",
  "crates/viewer",
  "crates/ui",
  "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
reflex-proto = { path = "crates/proto" }
reflex-auth = { path = "crates/auth" }
reflex-net = { path = "crates/net" }
reflex-media = { path = "crates/media" }
reflex-platform = { path = "crates/platform" }
reflex-host = { path = "crates/host" }
reflex-viewer = { path = "crates/viewer" }
reflex-ui = { path = "crates/ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.14"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
spake2 = "0.4"
libloading = "0.8"
windows-core = "0.61"
windows = "0.61"
windows-service = "0.8"
winsafe = { version = "0.0.29", features = ["gui", "kernel", "user", "gdi", "comctl", "shell", "dwm", "uxtheme"] }

# Build enxuto em disco: o grosso do `target\` era informação de depuração
# (PDBs) e cache incremental, que o Cargo nunca apaga sozinho.
[profile.dev]
debug = "line-tables-only" # backtrace com arquivo:linha, sem PDB completo
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
